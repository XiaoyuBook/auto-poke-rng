name: Sync to Gitee

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'XiaoyuBook/auto-poke-rng'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        if: github.event.deleted != true
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync branch or tag to Gitee
        shell: python
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_ACCESSS_TOKEN_AUTO_POKE_RNG }}
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          DELETED: ${{ github.event.deleted }}
        run: |
          import base64
          import os
          import subprocess

          token = os.environ['GITEE_TOKEN']
          if not token:
              raise SystemExit('GITEE_ACCESSS_TOKEN_AUTO_POKE_RNG is missing')

          auth = base64.b64encode(('shekongsk:' + token).encode()).decode()
          print('::add-mask::' + auth, flush=True)
          env = dict(
              os.environ,
              GIT_CONFIG_COUNT='1',
              GIT_CONFIG_KEY_0='http.https://gitee.com/.extraheader',
              GIT_CONFIG_VALUE_0='Authorization: Basic ' + auth,
          )
          gitee_url = 'https://gitee.com/shekongsk/auto-poke-rng.git'
          ref = os.environ['REF']

          if os.environ['DELETED'].lower() == 'true':
              subprocess.run(['git', 'init', '--quiet'], check=True)
              subprocess.run(['git', 'push', gitee_url, '--delete', ref], env=env, check=True)
          elif os.environ['REF_TYPE'] == 'branch':
              subprocess.run(['git', 'push', '--force', gitee_url, f'HEAD:{ref}'], env=env, check=True)
          elif os.environ['REF_TYPE'] == 'tag':
              subprocess.run(['git', 'push', '--force', gitee_url, f'{ref}:{ref}'], env=env, check=True)
